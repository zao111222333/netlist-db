[workspace]
members = ["pybind", "macros"]
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Junzhuo <zhou@junzhuo.site>"]
keywords = ["eda", "spice", "netlist", "database", "parser"]
readme = "README.md"
repository = "https://github.com/zao111222333/netlist-db/"
documentation = "https://docs.rs/netlist-db"
categories = ["development-tools"]
description = "Concurrent/Parallel SPICE (HSPICE) parser, under building."

[workspace.dependencies]
polars = { version = "0.46", features = ["fmt", "dtype-date", "timezones", "lazy"], default-features = false }
polars-arrow = { version = "0.46", default-features = false }
pyo3 = { version = "0.23", features = ["abi3-py37"] }
pyo3-polars = { version = "0.20", features = ["derive", "lazy"] }
tokio = { version = "1.43.0", features = ["full"] }
simple_logger = "5.0.0"
log = "0.4.25"
fast-float2 = "0.2.3"
indexmap = "2.9"
nom = "8"
nom_locate = "5"
regex = "1.11"
thiserror = "2"
anstyle = "1"
colored = "2.1"
itertools = "0.14"

[package]
name = "netlist-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
description.workspace = true
include = ["/src", "/examples", "README.md"]

[features]
defualt = []
py = ['dep:pyo3', 'dep:polars', 'dep:pyo3-polars', 'dep:polars-arrow']

[dependencies]
netlist-macros = { path = "macros" }
fast-float2.workspace = true
indexmap.workspace = true
log.workspace = true
nom.workspace = true
nom_locate.workspace = true
regex.workspace = true
thiserror.workspace = true
itertools.workspace = true
tokio.workspace = true
anstyle.workspace = true
colored.workspace = true
pyo3 = { workspace = true, optional = true }
pyo3-polars = { workspace = true, optional = true }
polars = { workspace = true, optional = true }
polars-arrow = { workspace = true, optional = true }

[dev-dependencies]
console = "0.15"
similar = { version = "2.7", features = ["inline"] }
simple_logger.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.43"